name: Build CybX Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - ".github/workflows/build-android-apk.yml"
      - "cybx-overlay-v0.4.0.zip"
      - "app-source-v0.4.0.zip"
      - "app-source-v0.3.3.zip"
      - "app-source-v0.3.4.zip"
      - "app-source-v0.3.2.zip"
      - "app-source.zip"

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore CybX Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f cybx-overlay-v0.4.0.zip ]; then
            test -f app-source-v0.3.3.zip
            unzip -oq app-source-v0.3.3.zip -d .
            unzip -oq cybx-overlay-v0.4.0.zip -d .
            echo "CYBX_VERSION=0.4.0" >> "$GITHUB_ENV"
          elif [ -f app-source-v0.4.0.zip ]; then
            unzip -oq app-source-v0.4.0.zip -d .
            echo "CYBX_VERSION=0.4.0" >> "$GITHUB_ENV"
          elif [ -f app-source-v0.3.4.zip ]; then
            unzip -oq app-source-v0.3.4.zip -d .
            echo "CYBX_VERSION=0.3.4" >> "$GITHUB_ENV"
          elif [ -f app-source-v0.3.3.zip ]; then
            unzip -oq app-source-v0.3.3.zip -d .
            echo "CYBX_VERSION=0.3.3" >> "$GITHUB_ENV"
          else
            echo "::error::No supported CybX app source archive found"
            exit 1
          fi
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/jniLibs/arm64-v8a/libproot.so
          test -f app/src/main/java/com/cybx/os/runtime/CybxTerminalController.kt
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'PINNED_ROOTFS_SHA256' app/src/main/java/com/cybx/os/runtime/LocalRuntimeInstaller.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Prepare stable signing key (optional)
        shell: bash
        env:
          CYBX_KEYSTORE_BASE64: ${{ secrets.CYBX_KEYSTORE_BASE64 }}
          CYBX_KEYSTORE_PASSWORD_SECRET: ${{ secrets.CYBX_KEYSTORE_PASSWORD }}
          CYBX_KEY_ALIAS_SECRET: ${{ secrets.CYBX_KEY_ALIAS }}
          CYBX_KEY_PASSWORD_SECRET: ${{ secrets.CYBX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${CYBX_KEYSTORE_BASE64:-}" ] &&
             [ -n "${CYBX_KEYSTORE_PASSWORD_SECRET:-}" ] &&
             [ -n "${CYBX_KEY_ALIAS_SECRET:-}" ] &&
             [ -n "${CYBX_KEY_PASSWORD_SECRET:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/cybx-release.jks"
            printf '%s' "$CYBX_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "CYBX_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "CYBX_KEYSTORE_PASSWORD=$CYBX_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "CYBX_KEY_ALIAS=$CYBX_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "CYBX_KEY_PASSWORD=$CYBX_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "CYBX_STABLE_SIGNING=true" >> "$GITHUB_ENV"
            echo "Stable CybX signing key configured."
          else
            echo "CYBX_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::Stable signing secrets are not configured. This build will use a temporary debug certificate and will not support direct in-place updates to future builds."
          fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$CYBX_STABLE_SIGNING" = "true" ]; then
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "dist/CybX-OS-v${CYBX_VERSION}.apk"
          else
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "dist/CybX-OS-v${CYBX_VERSION}.apk"
          fi
          sha256sum "dist/CybX-OS-v${CYBX_VERSION}.apk" | tee dist/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/CybX-OS-v${CYBX_VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CybX-OS-v${{ env.CYBX_VERSION }}-APK
          path: dist/*
          if-no-files-found: error
