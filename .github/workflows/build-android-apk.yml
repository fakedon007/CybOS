name: Build CybX Android APK v0.3.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app-source-v0.3.0.zip"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore Android app module from v0.3.0 source archive
        run: |
          set -euo pipefail
          test -f app-source-v0.3.0.zip || { echo "::error::Upload app-source-v0.3.0.zip to the repository root"; exit 1; }
          unzip -oq app-source-v0.3.0.zip -d .
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/cybx/os/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CybX-OS-v0.3.0-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
