name: Build CybX Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - ".github/workflows/build-android-apk.yml"
      - "app-source.zip"
      - "app-source-v0.3.2.zip"
      - "app-source-v0.3.3.zip"
      - "app-source-v0.3.4.zip"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore Android app module
        run: |
          if [ -f app-source-v0.3.4.zip ]; then
            SOURCE_ARCHIVE="app-source-v0.3.4.zip"
          elif [ -f app-source-v0.3.3.zip ]; then
            SOURCE_ARCHIVE="app-source-v0.3.3.zip"
          elif [ -f app-source-v0.3.2.zip ]; then
            SOURCE_ARCHIVE="app-source-v0.3.2.zip"
          elif [ -f app-source.zip ]; then
            SOURCE_ARCHIVE="app-source.zip"
          else
            echo "::error::No CybX app source archive found in repository root"
            exit 1
          fi
          echo "Restoring Android module from $SOURCE_ARCHIVE"
          unzip -oq "$SOURCE_ARCHIVE" -d .
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/cybx/os/MainActivity.kt

      - name: Apply Android 16 PRoot runtime compatibility patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("app/build.gradle.kts")
          s = gradle.read_text()
          s, n1 = re.subn(r"targetSdk\s*=\s*\d+", "targetSdk = 28", s, count=1)
          if n1 != 1:
              raise SystemExit("Could not safely set targetSdk to 28")
          s, n2 = re.subn(r"versionCode\s*=\s*\d+", "versionCode = 8", s, count=1)
          s, n3 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.3.5"', s, count=1)
          if n2 != 1 or n3 != 1:
              raise SystemExit("Could not safely update CybX version metadata")
          gradle.write_text(s)

          paths_file = Path("app/src/main/java/com/cybx/os/runtime/CybxPaths.kt")
          paths_file.write_text("""package com.cybx.os.runtime

          import android.content.Context
          import java.io.File

          class CybxPaths(context: Context) {
              val base = File(context.filesDir, "cybx").apply { mkdirs() }
              // Run the packaged host PRoot from Android's read-only native library directory.
              val prootExecutable = File(context.applicationInfo.nativeLibraryDir, "libproot.so")
              val rootfs = File(base, "rootfs")
              val downloads = File(base, "downloads").apply { mkdirs() }
              val bin = File(base, "bin").apply { mkdirs() }
              val logs = File(base, "logs").apply { mkdirs() }
              val prootTmp = File(base, "proot-tmp").apply { mkdirs() }
              val rootHome = File(base, "home-root").apply { mkdirs() }
              val rootfsArchive = File(downloads, "cybx-kali-arm64-rootfs.tar.xz")
          }
          """)

          adapter = Path("app/src/main/java/com/cybx/os/runtime/ProotAdapter.kt")
          adapter.write_text("""package com.cybx.os.runtime

          /** Runs the APK-packaged Android ARM64 PRoot binary from nativeLibraryDir. */
          class ProotAdapter(private val paths: CybxPaths) {
              private val executable = paths.prootExecutable

              fun isAvailable(): Boolean = executable.isFile && executable.canExecute() && executable.length() > 0

              fun buildShellCommand(command: String): List<String> {
                  require(isAvailable()) { "Bundled Android ARM64 PRoot is missing. Reinstall the CybX APK." }
                  require(paths.rootfs.isDirectory) { "Kali rootfs is not installed." }
                  return listOf(
                      executable.absolutePath, "--link2symlink", "-0",
                      "-r", paths.rootfs.absolutePath,
                      "-b", "/dev", "-b", "/proc", "-b", "/sys",
                      "-b", "${paths.rootHome.absolutePath}:/dev/shm",
                      "-w", "/root",
                      "/usr/bin/env", "-i",
                      "HOME=/root", "USER=root", "TERM=xterm-256color",
                      "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
                      "/bin/bash", "-lc", command
                  )
              }

              fun buildInteractiveShellCommand(): List<String> {
                  require(isAvailable()) { "Bundled Android ARM64 PRoot is missing. Reinstall the CybX APK." }
                  require(paths.rootfs.isDirectory) { "CybX Linux rootfs is not installed." }
                  return listOf(
                      executable.absolutePath, "--link2symlink", "-0",
                      "-r", paths.rootfs.absolutePath,
                      "-b", "/dev", "-b", "/proc", "-b", "/sys",
                      "-b", "${paths.rootHome.absolutePath}:/dev/shm",
                      "-w", "/root",
                      "/usr/bin/env", "-i",
                      "HOME=/root", "USER=root", "LOGNAME=root",
                      "LANG=C.UTF-8", "TERM=xterm-256color",
                      "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
                      "/bin/bash", "--noprofile", "--norc", "-i"
                  )
              }

              fun processBuilder(command: List<String>): ProcessBuilder {
                  if (!paths.prootTmp.exists()) {
                      check(paths.prootTmp.mkdirs() || paths.prootTmp.isDirectory) {
                          "Cannot create PRoot temporary directory: ${paths.prootTmp.absolutePath}"
                      }
                  }
                  check(paths.prootTmp.isDirectory && paths.prootTmp.canWrite()) {
                      "PRoot temporary directory is not writable: ${paths.prootTmp.absolutePath}"
                  }
                  if (!paths.rootHome.exists()) {
                      check(paths.rootHome.mkdirs() || paths.rootHome.isDirectory) {
                          "Cannot create Linux home directory: ${paths.rootHome.absolutePath}"
                      }
                  }
                  return ProcessBuilder(command).apply {
                      directory(paths.base)
                      redirectErrorStream(true)
                      environment()["PROOT_TMP_DIR"] = paths.prootTmp.absolutePath
                      environment()["TMPDIR"] = paths.prootTmp.absolutePath
                      environment()["HOME"] = paths.rootHome.absolutePath
                  }
              }

              fun startInteractiveShell(): Process = processBuilder(buildInteractiveShellCommand()).start()
          }
          """)
          print("Patched targetSdk=28, version=0.3.5, PRoot temp paths and process environment")
          PY

          grep -q 'targetSdk = 28' app/build.gradle.kts
          grep -q 'PROOT_TMP_DIR' app/src/main/java/com/cybx/os/runtime/ProotAdapter.kt
          test -f app/src/main/jniLibs/arm64-v8a/libproot.so

      - name: Make rootfs SHA-256 input paste-friendly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          installer = Path("app/src/main/java/com/cybx/os/runtime/LocalRuntimeInstaller.kt")
          s = installer.read_text()
          marker = "class LocalRuntimeInstaller(context: Context) {"
          helper = r"""/** Accept a raw SHA-256 or a standard sha256sum line. */
          internal fun normalizeRootfsSha256(input: String): String? {
              val withoutLabel = input.trim().replaceFirst(Regex("(?i)^sha-?256\\\\s*[:=]\\\\s*"), "")
              val token = withoutLabel.split(Regex("\\\\s+")).firstOrNull().orEmpty().trim().trim('"')
              return token.takeIf { Regex("(?i)^[0-9a-f]{64}$").matches(it) }?.lowercase()
          }

          """
          if "internal fun normalizeRootfsSha256" not in s:
              if marker not in s:
                  raise SystemExit("Could not find LocalRuntimeInstaller insertion point")
              s = s.replace(marker, helper + marker, 1)

          old_check = '            require(expectedSha256.matches(Regex("^[A-Fa-f0-9]{64}$"))) { "Enter a valid 64-character SHA-256" }'
          new_check = '            val normalizedExpected = normalizeRootfsSha256(expectedSha256)\n            require(normalizedExpected != null) { "Enter a 64-character SHA-256, or paste the full SHA256SUMS line." }'
          if old_check in s:
              s = s.replace(old_check, new_check, 1)
          elif "val normalizedExpected = normalizeRootfsSha256(expectedSha256)" not in s:
              raise SystemExit("Could not locate existing SHA validation")
          old_compare = "actual.equals(expectedSha256, ignoreCase = true)"
          if old_compare in s:
              s = s.replace(old_compare, "actual.equals(normalizedExpected, ignoreCase = true)", 1)
          elif "actual.equals(normalizedExpected, ignoreCase = true)" not in s:
              raise SystemExit("Could not locate SHA comparison")
          installer.write_text(s)

          activity = Path("app/src/main/java/com/cybx/os/MainActivity.kt")
          a = activity.read_text()
          old_enabled = 'enabled = !busy && sha.matches(Regex("^[A-Fa-f0-9]{64}$"))'
          new_enabled = 'enabled = !busy && normalizeRootfsSha256(sha) != null'
          if old_enabled in a:
              a = a.replace(old_enabled, new_enabled, 1)
          elif new_enabled not in a:
              raise SystemExit("Could not locate rootfs import button validation")
          old_label = 'label = { Text("Rootfs SHA-256 (64 hex characters)") }, singleLine = true)'
          new_label = 'label = { Text("Rootfs SHA-256") }, singleLine = true, supportingText = { Text("Paste the 64-character hash or the full SHA256SUMS line.") })'
          if old_label in a:
              a = a.replace(old_label, new_label, 1)
          elif "full SHA256SUMS line" not in a:
              raise SystemExit("Could not locate rootfs SHA input field")
          activity.write_text(a)

          gradle = Path("app/build.gradle.kts").read_text()
          if 'versionCode = 8' not in gradle or 'versionName = "0.3.5"' not in gradle:
              raise SystemExit("CybX 0.3.5 version metadata is missing")
          print("Rootfs SHA input accepts raw hash or sha256sum line, trims whitespace and optional SHA256: label.")
          PY

          grep -q 'normalizeRootfsSha256' app/src/main/java/com/cybx/os/runtime/LocalRuntimeInstaller.kt
          grep -q 'normalizeRootfsSha256(sha)' app/src/main/java/com/cybx/os/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CybX-OS-debug-APK-v0.3.5
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
