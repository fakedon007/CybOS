name: Build CybX Mobile AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-android-apk.yml"
      - "app-source-v0.4.1.zip"
      - "source-overlay/v0.5.0/**"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CybX source
        uses: actions/checkout@v4

      - name: Restore known ARM64 PRoot and safe rootfs installer base
        shell: bash
        run: |
          set -euxo pipefail
          test -f app-source-v0.4.1.zip
          mkdir -p "$RUNNER_TEMP/cybx-source"
          unzip -oq app-source-v0.4.1.zip -d "$RUNNER_TEMP/cybx-source"
          APP_GRADLE="$(find "$RUNNER_TEMP/cybx-source" -type f -path '*/app/build.gradle.kts' -print -quit)"
          test -n "$APP_GRADLE"
          PROJECT_ROOT="${APP_GRADLE%/app/build.gradle.kts}"
          cp -a "$PROJECT_ROOT/." "$GITHUB_WORKSPACE/"
          test -s app/src/main/jniLibs/arm64-v8a/libproot.so
          test -f app/src/main/java/com/cybx/os/runtime/CybxPaths.kt
          test -f app/src/main/java/com/cybx/os/runtime/LocalRuntimeInstaller.kt
          echo "CybX base source restored."

      - name: Apply CybX Mobile AI 0.5.0 implementation
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="source-overlay/v0.5.0"
          test -f "$ROOT/app/build.gradle.kts"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"
          cp "$ROOT/app/build.gradle.kts" app/build.gradle.kts
          cp "$ROOT/app/src/main/AndroidManifest.xml" app/src/main/AndroidManifest.xml
          cp "$ROOT/app/src/main/java/com/cybx/os/MainActivity.kt" app/src/main/java/com/cybx/os/MainActivity.kt
          mkdir -p app/src/main/java/com/cybx/os/agent
          mkdir -p app/src/main/java/com/cybx/os/ai
          mkdir -p app/src/main/java/com/cybx/os/reports
          cp "$ROOT/app/src/main/java/com/cybx/os/agent/"*.kt app/src/main/java/com/cybx/os/agent/
          cp "$ROOT/app/src/main/java/com/cybx/os/ai/"*.kt app/src/main/java/com/cybx/os/ai/
          cp "$ROOT/app/src/main/java/com/cybx/os/reports/"*.kt app/src/main/java/com/cybx/os/reports/
          cp "$ROOT/app/src/main/java/com/cybx/os/runtime/CybxShell.kt" app/src/main/java/com/cybx/os/runtime/CybxShell.kt
          cp "$ROOT/app/src/main/java/com/cybx/os/runtime/ProotAdapter.kt" app/src/main/java/com/cybx/os/runtime/ProotAdapter.kt
          rm -f app/src/main/java/com/cybx/os/runtime/CybxTerminalHost.kt
          grep -q 'versionCode = 13' app/build.gradle.kts
          grep -q 'versionName = "0.5.0"' app/build.gradle.kts
          grep -q 'concurrent-futures:1.2.0' app/build.gradle.kts
          grep -q 'listenablefuture:1.0' app/build.gradle.kts
          ! grep -q 'terminal-view' app/build.gradle.kts
          ! grep -R 'com.termux.view.TerminalView\|CybxTerminalHost' app/src/main/java/com/cybx/os/MainActivity.kt app/src/main/java/com/cybx/os/runtime || true
          grep -q 'isRfc1918' app/src/main/java/com/cybx/os/agent/LabScope.kt
          grep -q 'ProcessBuilder' app/src/main/java/com/cybx/os/runtime/CybxShell.kt
          echo "CybX 0.5.0 sources staged."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Prepare stable signing key (optional)
        shell: bash
        env:
          CYBX_KEYSTORE_BASE64: ${{ secrets.CYBX_KEYSTORE_BASE64 }}
          CYBX_KEYSTORE_PASSWORD_SECRET: ${{ secrets.CYBX_KEYSTORE_PASSWORD }}
          CYBX_KEY_ALIAS_SECRET: ${{ secrets.CYBX_KEY_ALIAS }}
          CYBX_KEY_PASSWORD_SECRET: ${{ secrets.CYBX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${CYBX_KEYSTORE_BASE64:-}" ] &&
             [ -n "${CYBX_KEYSTORE_PASSWORD_SECRET:-}" ] &&
             [ -n "${CYBX_KEY_ALIAS_SECRET:-}" ] &&
             [ -n "${CYBX_KEY_PASSWORD_SECRET:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/cybx-release.jks"
            printf '%s' "$CYBX_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "CYBX_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "CYBX_KEYSTORE_PASSWORD=$CYBX_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "CYBX_KEY_ALIAS=$CYBX_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "CYBX_KEY_PASSWORD=$CYBX_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "CYBX_STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "CYBX_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::No persistent release key is configured. This is a debug-signed test APK and may not update over an APK with a different signing key."
          fi

      - name: Build APK and verify package signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$CYBX_STABLE_SIGNING" = "true" ]; then
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk dist/CybX-Mobile-AI-v0.5.0-release.apk
          else
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk dist/CybX-Mobile-AI-v0.5.0-debug.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CybX-Mobile-AI-v0.5.0-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 90
