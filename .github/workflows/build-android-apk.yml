name: Build CybX Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-android-apk.yml"
      - "app-source-v0.3.3.zip"
      - "cybx-v0.4.0.patch"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CybX source
        uses: actions/checkout@v4

      - name: Restore v0.3.3 source and apply tested v0.4.0 patch
        shell: bash
        run: |
          set -euo pipefail
          test -f app-source-v0.3.3.zip
          test -f cybx-v0.4.0.patch
          unzip -oq app-source-v0.3.3.zip -d .
          patch --batch --forward -p1 < cybx-v0.4.0.patch
          test -f app/src/main/java/com/cybx/os/runtime/CybxTerminalHost.kt
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'versionName = "0.4.0"' app/build.gradle.kts
          grep -q '96aeced81a857a987715a14417af05c2934e3e19052d6151c398a1c215448b60' app/src/main/java/com/cybx/os/runtime/LocalRuntimeInstaller.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Prepare stable signing key (optional)
        shell: bash
        env:
          CYBX_KEYSTORE_BASE64: ${{ secrets.CYBX_KEYSTORE_BASE64 }}
          CYBX_KEYSTORE_PASSWORD_SECRET: ${{ secrets.CYBX_KEYSTORE_PASSWORD }}
          CYBX_KEY_ALIAS_SECRET: ${{ secrets.CYBX_KEY_ALIAS }}
          CYBX_KEY_PASSWORD_SECRET: ${{ secrets.CYBX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${CYBX_KEYSTORE_BASE64:-}" ] &&
             [ -n "${CYBX_KEYSTORE_PASSWORD_SECRET:-}" ] &&
             [ -n "${CYBX_KEY_ALIAS_SECRET:-}" ] &&
             [ -n "${CYBX_KEY_PASSWORD_SECRET:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/cybx-release.jks"
            printf '%s' "$CYBX_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "CYBX_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "CYBX_KEYSTORE_PASSWORD=$CYBX_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "CYBX_KEY_ALIAS=$CYBX_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "CYBX_KEY_PASSWORD=$CYBX_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "CYBX_STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "CYBX_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::Stable signing secrets are not configured. A temporary debug-signed APK will be produced; it will not be compatible as an in-place update from earlier signing keys."
          fi

      - name: Build APK and verify package signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$CYBX_STABLE_SIGNING" = "true" ]; then
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk dist/CybX-OS-v0.4.0-release.apk
          else
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk dist/CybX-OS-v0.4.0-debug.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload CybX APK
        uses: actions/upload-artifact@v4
        with:
          name: CybX-OS-v0.4.0-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 90
