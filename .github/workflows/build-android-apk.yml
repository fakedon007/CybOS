name: Build CybX Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-android-apk.yml"
      - "app-source-v0.4.0.zip"
      - "cybx-v0.4.0.patch"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CybX source
        uses: actions/checkout@v4

      - name: Restore CybX v0.4.0 project source
        shell: bash
        run: |
          set -euxo pipefail
          test -f app-source-v0.4.0.zip
          mkdir -p "$RUNNER_TEMP/cybx-source"
          unzip -oq app-source-v0.4.0.zip -d "$RUNNER_TEMP/cybx-source"
          APP_GRADLE="$(find "$RUNNER_TEMP/cybx-source" -type f -path '*/app/build.gradle.kts' -print -quit)"
          test -n "$APP_GRADLE"
          PROJECT_ROOT="${APP_GRADLE%/app/build.gradle.kts}"
          echo "Using source root: $PROJECT_ROOT"
          cp -a "$PROJECT_ROOT/." "$GITHUB_WORKSPACE/"
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/cybx/os/MainActivity.kt
          test -f app/src/main/java/com/cybx/os/runtime/CybxTerminalHost.kt
          echo "CybX source restored successfully."

      - name: Fix adaptive icon Compose crash and bump version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/cybx/os/MainActivity.kt")
          s = p.read_text()
          if "painterResource(R.mipmap.ic_launcher)" not in s:
              raise SystemExit("Expected adaptive-icon painter usage was not found")
          s = s.replace("painterResource(R.mipmap.ic_launcher)", "painterResource(R.drawable.ic_launcher_foreground)")
          p.write_text(s)
          g = Path("app/build.gradle.kts")
          t = g.read_text()
          if "versionCode = 9" not in t or 'versionName = "0.4.0"' not in t:
              raise SystemExit("Unexpected source version; refusing unsafe version edit")
          t = t.replace("versionCode = 9", "versionCode = 10", 1)
          t = t.replace('versionName = "0.4.0"', 'versionName = "0.4.1"', 1)
          g.write_text(t)
          if "painterResource(R.mipmap.ic_launcher)" in s:
              raise SystemExit("Adaptive icon reference still present in Compose UI")
          print("Replaced AdaptiveIconDrawable resource with foreground VectorDrawable; version 0.4.1")
          PY
          grep -q 'versionCode = 10' app/build.gradle.kts
          grep -q 'versionName = "0.4.1"' app/build.gradle.kts
          ! grep -q 'painterResource(R.mipmap.ic_launcher)' app/src/main/java/com/cybx/os/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Prepare stable signing key (optional)
        shell: bash
        env:
          CYBX_KEYSTORE_BASE64: ${{ secrets.CYBX_KEYSTORE_BASE64 }}
          CYBX_KEYSTORE_PASSWORD_SECRET: ${{ secrets.CYBX_KEYSTORE_PASSWORD }}
          CYBX_KEY_ALIAS_SECRET: ${{ secrets.CYBX_KEY_ALIAS }}
          CYBX_KEY_PASSWORD_SECRET: ${{ secrets.CYBX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${CYBX_KEYSTORE_BASE64:-}" ] &&
             [ -n "${CYBX_KEYSTORE_PASSWORD_SECRET:-}" ] &&
             [ -n "${CYBX_KEY_ALIAS_SECRET:-}" ] &&
             [ -n "${CYBX_KEY_PASSWORD_SECRET:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/cybx-release.jks"
            printf '%s' "$CYBX_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "CYBX_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "CYBX_KEYSTORE_PASSWORD=$CYBX_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "CYBX_KEY_ALIAS=$CYBX_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "CYBX_KEY_PASSWORD=$CYBX_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "CYBX_STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "CYBX_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::Stable signing secrets are not configured. A temporary debug-signed APK will be produced; it will not be compatible as an in-place update from earlier signing keys."
          fi

      - name: Build APK and verify package signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$CYBX_STABLE_SIGNING" = "true" ]; then
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk dist/CybX-OS-v0.4.1-release.apk
          else
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk dist/CybX-OS-v0.4.1-debug.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload CybX APK
        uses: actions/upload-artifact@v4
        with:
          name: CybX-OS-v0.4.1-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 90
