name: Build CybX ARM64 Runtime Bundle

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-cybx-runtime.yml"

permissions:
  contents: read

jobs:
  runtime-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare bundle directory
        run: mkdir -p runtime-bundle

      - name: Download and verify official Kali NetHunter Minimal ARM64 rootfs
        shell: bash
        run: |
          set -euo pipefail
          cd runtime-bundle
          ROOTFS="kali-nethunter-rootfs-minimal-arm64.tar.xz"
          BASE="https://kali.download/nethunter-images/current/rootfs"
          curl --fail --location --retry 3 --retry-delay 2 "$BASE/SHA256SUMS" -o KALI-SHA256SUMS.txt
          EXPECTED="$(awk -v f="$ROOTFS" '$2 == f {print $1}' KALI-SHA256SUMS.txt | head -n1)"
          test "${#EXPECTED}" -eq 64
          curl --fail --location --retry 3 --retry-delay 2 "$BASE/$ROOTFS" -o "$ROOTFS"
          printf '%s  %s\n' "$EXPECTED" "$ROOTFS" | sha256sum --check -
          printf '%s  %s\n' "$EXPECTED" "$ROOTFS" > ROOTFS-SHA256.txt

      - name: Fetch portable Android ARM64 PRoot and verify upstream source
        shell: bash
        run: |
          set -euo pipefail
          cd runtime-bundle
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/skirsten/proot-portable-android-binaries/gh-pages/aarch64/proot" -o proot
          chmod 700 proot
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b = Path("proot").read_bytes()
          if len(b) < 64 or b[:4] != b"\x7fELF":
              raise SystemExit("Downloaded PRoot is not an ELF executable")
          if b[4] != 2 or b[5] != 1 or struct.unpack_from("<H", b, 18)[0] != 183:
              raise SystemExit("Downloaded PRoot is not ELF64 little-endian AArch64")
          print(f"PRoot ELF verified: {len(b)} bytes, AArch64")
          PY
          ACTUAL_GIT_BLOB="$( (printf 'blob %s\0' "$(stat -c%s proot)"; cat proot) | sha1sum | awk '{print $1}')"
          EXPECTED_GIT_BLOB="cdfdd6a3f03d6dfb7e4a83a25e8d50c3e668efc7"
          test "$ACTUAL_GIT_BLOB" = "$EXPECTED_GIT_BLOB"
          curl --fail --location --retry 3 "https://github.com/termux/proot/archive/1f4ec1c9d3fcc5d44c2a252eda6d09b0c24928cd.zip" -o proot-source.zip
          printf '%s  %s\n' "1119f1d27ca7a655eb627ad227fbd9c7a0343ea988dad3ed620fd6cd98723c20" proot-source.zip | sha256sum --check -
          sha256sum proot | tee PROOT-SHA256.txt
          sha256sum proot > SHA256SUMS.txt
          cat ROOTFS-SHA256.txt >> SHA256SUMS.txt

      - name: Write runtime instructions and source provenance
        shell: bash
        run: |
          cat > runtime-bundle/README_RUNTIME.txt <<'EOF'
          CybX Mobile — ARM64 rootless runtime bundle

          Files:
            proot
              Android ARM64 portable PRoot executable. Import this file in CybX OS.
            kali-nethunter-rootfs-minimal-arm64.tar.xz
              Official Kali NetHunter Minimal ARM64 root filesystem archive.
            SHA256SUMS.txt
              SHA-256 hashes for the PRoot binary and Kali rootfs archive.
            KALI-SHA256SUMS.txt
              The official Kali checksum list downloaded from the same rootfs directory.
            proot-source.zip
              Pinned upstream Termux PRoot source snapshot.
            PROOT-SOURCE.txt
              Upstream source references.

          Install:
            1. Extract this artifact ZIP.
            2. Open CybX OS > Linux Setup.
            3. Copy the hash on the "proot" line of SHA256SUMS.txt into the PRoot SHA-256 field, if your app build has that field.
            4. Choose the "proot" file and import it.
            5. Copy the hash on the "kali-nethunter-rootfs-minimal-arm64.tar.xz" line into the Rootfs SHA-256 field.
            6. Choose the .tar.xz archive and import it.
            7. Open Terminal and try: uname -m ; cat /etc/os-release

          Provenance and limitations:
            - Kali rootfs is downloaded from Kali's official NetHunter current/rootfs directory and verified against its contemporaneous official SHA256SUMS file.
            - PRoot binary is from the public skirsten/proot-portable-android-binaries gh-pages branch. Its GitHub Git-blob SHA-1 is pinned and checked, and ELF64 little-endian AArch64 is verified. This is not a Kali-signed or Termux-signed binary.
            - A checksum proves bytes match the pinned artifact; it does not independently certify the binary publisher or build environment.
            - This is a rootless user-space environment using the Android host kernel. It is not a bootable CybX OS image and does not grant Android root.
            - Kernel-only features such as monitor mode/injection, HID gadget mode, and privileged hardware access are not provided.
            - Keep at least 2 GB free internal storage before extracting the minimal rootfs.
            - Use security tools only on systems and networks you own or are authorized to test.
          EOF
          cat > runtime-bundle/PROOT-SOURCE.txt <<'EOF'
          Portable PRoot repository:
            https://github.com/skirsten/proot-portable-android-binaries

          The repository README describes this as Android portable builds based on the Termux PRoot package and requires PROOT_TMP_DIR to be set because /tmp is unavailable on Android.

          Pinned published AArch64 binary Git blob:
            cdfdd6a3f03d6dfb7e4a83a25e8d50c3e668efc7
            https://raw.githubusercontent.com/skirsten/proot-portable-android-binaries/gh-pages/aarch64/proot

          Pinned Termux PRoot source commit:
            https://github.com/termux/proot/archive/1f4ec1c9d3fcc5d44c2a252eda6d09b0c24928cd.zip
            SHA-256: 1119f1d27ca7a655eb627ad227fbd9c7a0343ea988dad3ed620fd6cd98723c20

          Review the project sources and licensing before redistribution.
          EOF

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: CybX-ARM64-Runtime-Bundle
          path: runtime-bundle/
          if-no-files-found: error
          retention-days: 30
